name: Build PEACG01

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gcc gawk \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file \
            wget python3 python3-ply python3-setuptools swig libelf-dev

      - name: Clone OpenWrt v25.12.6
        run: |
          git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add HOMEd feed
        run: |
          cd openwrt
          echo 'src-git homed https://github.com/inoremap/homed-feed.git' >> feeds.conf.default
          ./scripts/feeds update homed
          ./scripts/feeds install -a -p homed

      - name: Clone and inspect patches
        run: |
          git clone --depth 1 --branch perenio-peacg01 \
            https://github.com/u236/openwrt-patches.git patches
          echo "=== Содержимое репозитория патчей: ==="
          find patches -type f -not -path "*/.git/*" | sort

      - name: Apply patches
        run: |
          cd openwrt

          # Корень с патчами: либо корень ветки, либо директория perenio-peacg01 внутри
          if [ -d ../patches/perenio-peacg01 ] && \
             [ -z "$(find ../patches -mindepth 1 -maxdepth 1 -type f -not -path '*/.git*' -print -quit)" ]; then
            SRC=../patches/perenio-peacg01
          else
            SRC=../patches
          fi
          echo "=== Корень патчей: $SRC ==="

          echo "=== Применяем .patch-файлы ==="
          failed=""
          while IFS= read -r p; do
            rel="${p#$SRC/}"
            echo "--- $rel"
            if git apply --whitespace=nowarn "$p"; then
              echo "OK: git apply"
            elif git apply --3way --whitespace=nowarn "$p"; then
              echo "OK: git apply --3way"
            elif patch -p1 --forward --batch < "$p"; then
              echo "OK: patch -p1"
            else
              echo "FAILED: $rel"
              failed="$failed $rel"
            fi
          done < <(find "$SRC" -type f -name '*.patch' | sort)

          echo "=== Копируем файлы-оверлеи (не .patch) ==="
          while IFS= read -r f; do
            rel="${f#$SRC/}"
            if [ -e "$rel" ]; then
              echo "OVERWRITE: '$rel' уже существует в дереве OpenWrt — не затираю, копирую в ../patch-overwrites/"
              mkdir -p "../patch-overwrites/$(dirname "$rel")"
              cp "$f" "../patch-overwrites/$rel"
            else
              echo "COPY: $rel"
              mkdir -p "$(dirname "$rel")"
              cp "$f" "$rel"
            fi
          done < <(find "$SRC" -type f ! -name '*.patch' | sort)

          if [ -n "$failed" ]; then
            echo "Не применились патчи:$failed"
            exit 1
          fi

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-overwrites
          path: patch-overwrites/
          if-no-files-found: ignore

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_nand=y
          CONFIG_TARGET_ath79_nand_Device_perenio_peacg01=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-ser2net=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_LUCI_LANG_ru=y

          CONFIG_PACKAGE_ser2net=y
          CONFIG_PACKAGE_mosquitto-ssl=y
          CONFIG_PACKAGE_wpad-wolfssl=y
          CONFIG_PACKAGE_ath10k-firmware-qca9887-ct=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_mc=y
          CONFIG_PACKAGE_nano-full=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_PACKAGE_python3-pyserial=y
          CONFIG_PACKAGE_python3-xmodem=y
          CONFIG_PACKAGE_kmod-usb-serial-ch341=y
          CONFIG_PACKAGE_kmod-usb-serial-pl2303=y

          CONFIG_PACKAGE_homed-common=y
          CONFIG_PACKAGE_homed-zigbee=y
          CONFIG_PACKAGE_homed-web=y
          CONFIG_PACKAGE_homed-automation=y
          CONFIG_PACKAGE_homed-custom=y
          CONFIG_PACKAGE_homed-recorder=y
          CONFIG_PACKAGE_homed-qt=y
          EOF
          make defconfig

      - name: Verify config
        run: |
          cd openwrt
          grep -q "^CONFIG_TARGET_ath79_nand_Device_perenio_peacg01=y" .config \
            || { echo "Профиль perenio_peacg01 не объявился — патчи не легли"; exit 1; }
          grep -q "^CONFIG_PACKAGE_homed-zigbee=y" .config \
            || { echo "Пакеты HOMEd не найдены в фиде"; exit 1; }

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-peacg01-25.12.6
          path: openwrt/bin/targets/ath79/nand/
          if-no-files-found: error
