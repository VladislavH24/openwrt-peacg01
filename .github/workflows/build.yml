name: Build PEACG01

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gcc gawk \
            gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file \
            wget python3 python3-ply python3-setuptools swig libelf-dev diffutils

      - name: Clone OpenWrt v25.12.6
        run: |
          git clone --depth 1 --branch v25.12.6 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Clone and inspect patches
        run: |
          git clone --depth 1 https://github.com/u236/openwrt-patches.git patches
          echo "=== Содержимое репозитория патчей: ==="
          find patches -type f -not -path "*/.git/*" | sort

      - name: Apply patches
        env:
          PATCH_BASE: v22.03.5
        run: |
          echo "=== APPLY-PATCHES v9: сохранение прав файлов при слиянии (fix Permission denied) ==="
          cd openwrt

          BASE=../patches/perenio-peacg01
          SRC="$BASE/v22.03.5"
          if [ ! -d "$SRC" ]; then
            echo "Директория $SRC не найдена — использую корень репозитория патчей"
            SRC="$BASE"
          fi
          echo "=== Корень патчей (оверлеи): $SRC ==="

          mkdir -p ../patch-overwrites /tmp/merge-base

          status=0
          while IFS= read -r f; do
            rel="${f#$SRC/}"

            case "$rel" in
              README*|.config|files/etc/opkg/*|\
              target/linux/ath79/nand/base-files/etc/board.d/02_network)
                echo "SKIP: $rel (не переносится в 25.12 либо переносится отдельным шагом)"
                continue
                ;;
            esac

            if [ ! -e "$rel" ]; then
              echo "COPY: $rel — новый файл в дереве OpenWrt"
              mkdir -p "$(dirname "$rel")"
              cp "$f" "$rel"
            else
              echo "MERGE: $rel уже существует в 25.12 — трёхстороннее слияние diff3"
              mkdir -p "/tmp/merge-base/$(dirname "$rel")"
              if curl -fsSL "https://raw.githubusercontent.com/openwrt/openwrt/${PATCH_BASE}/${rel}" \
                   -o "/tmp/merge-base/${rel}"; then
                mode=$(stat -c %a "$rel")
                if diff3 -m "$rel" "/tmp/merge-base/${rel}" "$f" > "$rel.merged"; then
                  mv "$rel.merged" "$rel"
                  chmod "$mode" "$rel"
                  echo "MERGED: $rel — изменения 22.03.5 легли на 25.12 чисто (режим $mode сохранён)"
                else
                  echo "CONFLICT: $rel — diff3 оставил маркеры, файл в артефакте merged/"
                  mkdir -p "../patch-overwrites/merged/$(dirname "$rel")"
                  cp "$rel.merged" "../patch-overwrites/merged/$rel"
                  mkdir -p "../patch-overwrites/from-patches/$(dirname "$rel")"
                  cp "$f" "../patch-overwrites/from-patches/$rel"
                  status=1
                fi
              else
                echo "MANUAL: не удалось скачать базу ${PATCH_BASE} для $rel — оверлей в артефакте from-patches/"
                mkdir -p "../patch-overwrites/from-patches/$(dirname "$rel")"
                cp "$f" "../patch-overwrites/from-patches/$rel"
                status=1
              fi
            fi
          done < <(find "$SRC" -type f | sort)

          if [ "$status" -ne 0 ]; then
            echo "Есть конфликты слияния — разбери артефакт patch-overwrites"
            exit 1
          fi

      - name: Fix DTS caldata and MAC for kernel 6.12 (nvmem-cells)
        run: |
          cd openwrt
          echo "=== DTS-FIX v1: mtd-cal-data/mtd-mac-address -> nvmem-cells (требование ядра 6.x) ==="
          DTS=$(find target/linux/ath79/dts -name 'qca9531_perenio_peacg01.dts')
          if [ -z "$DTS" ]; then
            echo "ОШИБКА: dts qca9531_perenio_peacg01 не найден в target/linux/ath79/dts"
            exit 1
          fi
          echo "Файл: $DTS"
          python3 - "$DTS" <<'PYEOF'
          import re, sys, pathlib

          path = pathlib.Path(sys.argv[1])
          src = path.read_text()

          mac_refs = re.findall(r'mtd-mac-address\s*=\s*<&(\w+)\s+0x([0-9a-fA-F]+)>;', src)
          cal_refs = re.findall(r'mtd-cal-data\s*=\s*<&(\w+)\s+0x([0-9a-fA-F]+)>;', src)
          print("MAC-ссылки:", mac_refs)
          print("CAL-ссылки:", cal_refs)
          if not mac_refs and not cal_refs:
              print("ОШИБКА: в dts нет mtd-cal-data/mtd-mac-address — схема не соответствует ожиданиям, нужен ручной разбор")
              sys.exit(1)

          prefix = {"macaddr": "macaddr", "calibration": "cal"}
          cells_by_base = {}
          for kind, refs in (("macaddr", mac_refs), ("calibration", cal_refs)):
              for base, off in refs:
                  o = int(off, 16)
                  name = f"{prefix[kind]}_{base}_{o:x}"
                  if name in cells_by_base.get(base, {}):
                      continue
                  if kind == "macaddr":
                      node = f"\t\t{name}: macaddr@{o:x} {{\n\t\t\treg = <0x{o:x} 0x6>;\n\t\t}};\n"
                  else:
                      node = f"\t\t{name}: calibration@{o:x} {{\n\t\t\treg = <0x{o:x} 0x440>;\n\t\t}};\n"
                  cells_by_base.setdefault(base, {})[name] = node

          for base, off in mac_refs:
              o = int(off, 16)
              name = f"macaddr_{base}_{o:x}"
              src = re.sub(rf'mtd-mac-address\s*=\s*<&{base}\s+0x{off}>;',
                           f'nvmem-cells = <&{name}>;\n\tnvmem-cell-names = "mac-address";', src)
          for base, off in cal_refs:
              o = int(off, 16)
              name = f"cal_{base}_{o:x}"
              src = re.sub(rf'mtd-cal-data\s*=\s*<&{base}\s+0x{off}>;',
                           f'nvmem-cells = <&{name}>;\n\tnvmem-cell-names = "calibration";', src)

          for base, cells in cells_by_base.items():
              m = re.search(rf'{base}:\s*partition@([0-9a-fA-F]+)\s*\{{', src)
              if not m:
                  print(f"ОШИБКА: partition-узел {base}: не найден в dts")
                  sys.exit(1)
              start = m.end() - 1
              depth = 0
              end = None
              for j in range(start, len(src)):
                  if src[j] == '{':
                      depth += 1
                  elif src[j] == '}':
                      depth -= 1
                      if depth == 0:
                          end = j
                          break
              if end is None:
                  print(f"ОШИБКА: не найдена закрывающая скобка узла {base}:")
                  sys.exit(1)
              inject = ('\n\t\tcompatible = "nvmem-cells";\n'
                        '\t\t#address-cells = <1>;\n'
                        '\t\t#size-cells = <1>;\n\n'
                        + '\n'.join(c.rstrip('\n') for c in cells.values()) + '\n\n')
              src = src[:end] + inject + src[end:]

          if 'mtd-cal-data' in src or 'mtd-mac-address' in src:
              print("ОШИБКА: в dts остались старые свойства — конвертация не полная")
              sys.exit(1)
          if 'calibration' not in src or 'mac-address' not in src:
              print("ОШИБКА: nvmem-ячейки не добавлены")
              sys.exit(1)

          path.write_text(src)
          print("DTS конвертирован на nvmem-cells")
          PYEOF
          echo "=== Итоговый dts: ==="
          cat "$DTS"

      - name: Write resolved 02_network
        run: |
          cd openwrt
          cat > target/linux/ath79/nand/base-files/etc/board.d/02_network <<'EOF'
          . /lib/functions/system.sh
          . /lib/functions/uci-defaults.sh

          ath79_setup_interfaces()
          {
          	local board="$1"

          	case "$board" in
          	aerohive,hiveap-121|\
          	meraki,mr18|\
          	perenio,peacg01)
          		ucidef_set_interface_lan "eth0"
          		;;
          	domywifi,dw33d)
          		ucidef_add_switch "switch0" \
          			"0u@eth0" "1:wan" "2:lan" "3:lan" "4:lan" "5:lan" "6u@eth1"
          		;;
          	dongwon,dw02-412h-64m|\
          	dongwon,dw02-412h-128m)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "2:lan:4" "3:lan:3" "4:lan:2" "5:lan:1" "1:wan"
          		;;
          	glinet,gl-ar750s-nor|\
          	glinet,gl-ar750s-nor-nand)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "2:lan:2" "3:lan:1" "1:wan"
          		;;
          	glinet,gl-e750|\
          	zte,mf282)
          		ucidef_set_interface_lan "eth0"
          		ucidef_set_interface "wan" device "/dev/cdc-wdm0" protocol "qmi"
          		;;
          	glinet,gl-xe300)
          		ucidef_set_interface_wan "eth1"
          		ucidef_add_switch "switch0" \
          			"0@eth0" "4:lan"
          		;;
          	glinet,gl-x1200-nor|\
          	glinet,gl-x1200-nor-nand)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "1:lan:4" "2:lan:3" "3:lan:2" "4:lan:1" "5:wan"
          		;;
          	linksys,ea4500-v3)
          		ucidef_add_switch "switch0" \
          			"6u@eth1" "1:lan" "2:lan" "3:lan" "4:lan" "5:wan" "0u@eth0"
          		;;
          	netgear,pgzng1)
          		ucidef_set_interfaces_lan_wan "eth1" "eth0"
          		;;
          	netgear,r6100)
          		ucidef_set_interface_wan "eth1"
          		ucidef_add_switch "switch0" \
          			"0@eth0" "1:lan:4" "2:lan:1" "3:lan:2" "4:lan:3"
          		;;
          	netgear,wndr3700-v4|\
          	netgear,wndr4300|\
          	netgear,wndr4300sw|\
          	netgear,wndr4300-v2)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "1:lan:4" "2:lan:3" "3:lan:2" "4:lan:1" "5:wan"
          		;;
          	netgear,wndr4500-v3)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "1:lan" "2:lan" "3:lan" "4:lan" "5:wan"
          		;;
          	netgear,wndr4300tn)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "1:lan:4" "2:lan:3" "3:lan:2" "4:lan:1"
          		;;
          	zte,mf281)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "5:lan"
          		;;
          	zte,mf286|\
          	zte,mf286a|\
          	zte,mf286c|\
          	zte,mf286r)
          		ucidef_add_switch "switch0" \
          			"0@eth0" "1:lan:4" "2:lan:3" "3:lan:2" "5:lan:1"
          		;;
          	zyxel,emg2926-q10a|\
          	zyxel,nbg6716)
          		ucidef_add_switch "switch0" \
          			"0u@eth0" "1:lan" "2:lan" "3:lan" "4:lan" "5:wan" "6u@eth1"
          		;;
          	*)
          		ucidef_set_interfaces_lan_wan "eth0" "eth1"
          		;;
          	esac
          }

          ath79_setup_macs()
          {
          	local board="$1"

          	case "$board" in
          	dongwon,dw02-412h-64m|\
          	dongwon,dw02-412h-128m)
          		wan_mac=$(mtd_get_mac_binary art 0x0)
          		label_mac=$wan_mac
          		;;
          	glinet,gl-x1200-nor|\
          	glinet,gl-x1200-nor-nand)
          		wan_mac=$(mtd_get_mac_binary art 0x0)
          		lan_mac=$(macaddr_add "$wan_mac" 1)
          		;;
          	meraki,mr18)
          		lan_mac=$(mtd_get_mac_binary_ubi board-config 102)
          		;;
          	netgear,wndr3700-v4|\
          	netgear,wndr4300|\
          	netgear,wndr4300sw|\
          	netgear,wndr4300-v2|\
          	netgear,wndr4500-v3)
          		wan_mac=$(mtd_get_mac_binary caldata 0x6)
          		;;
          	perenio,peacg01)
          		lan_mac=$(mtd_get_mac_binary art 0x0)
          		label_mac=$lan_mac
          		;;
          	esac

          	[ -n "$lan_mac" ] && ucidef_set_interface_macaddr "lan" $lan_mac
          	[ -n "$wan_mac" ] && ucidef_set_interface_macaddr "wan" $wan_mac
          	[ -n "$label_mac" ] && ucidef_set_label_macaddr $label_mac
          }

          board_config_update
          board=$(board_name)
          ath79_setup_interfaces $board
          ath79_setup_macs $board
          board_config_flush

          exit 0
          EOF

      - name: Embed HOMEd repository and key
        run: |
          cd openwrt

          # Ключ репозитория: основной источник — apk.homed.dev/apk.key (актуальный адрес
          # по wiki HOMEd для APK-репозитория), запасной — opkg.homed.dev/opkg.key.
          mkdir -p files/etc/apk/keys
          KEY_OK=0
          if curl -fsSL https://apk.homed.dev/apk.key -o files/etc/apk/keys/homed-dev.pub \
             && [ -s files/etc/apk/keys/homed-dev.pub ]; then
            KEY_OK=1
            echo "Ключ HOMEd скачан с apk.homed.dev/apk.key ($(wc -c < files/etc/apk/keys/homed-dev.pub) байт)"
          elif curl -fsSL https://opkg.homed.dev/opkg.key -o files/etc/apk/keys/homed-dev.pub \
             && [ -s files/etc/apk/keys/homed-dev.pub ]; then
            KEY_OK=1
            echo "Ключ HOMEd скачан с opkg.homed.dev/opkg.key (запасной адрес) ($(wc -c < files/etc/apk/keys/homed-dev.pub) байт)"
          else
            echo "ОШИБКА: ключ не скачался ни с apk.homed.dev/apk.key, ни с opkg.homed.dev/opkg.key"
            exit 1
          fi

          if grep -q "BEGIN" files/etc/apk/keys/homed-dev.pub; then
            echo "Ключ выглядит как PEM"
          else
            echo "ПРЕДУПРЕЖДЕНИЕ: ключ не похож на PEM — если apk на устройстве ругнётся на подпись, поправим ключ вручную"
          fi

          # Репозиторий: проверяем mips_24kc (big-endian, правильный для ath79), иначе mipsel
          FEED_A="https://apk.homed.dev/mips_24kc"
          FEED_B="https://apk.homed.dev/mipsel_24kc"
          if curl -fsSI "$FEED_A/packages.adb" -o /dev/null; then
            FEED_URL="$FEED_A"
            echo "Репозиторий доступен: $FEED_URL (big-endian, правильный для ath79)"
          elif curl -fsSI "$FEED_B/packages.adb" -o /dev/null; then
            FEED_URL="$FEED_B"
            echo "ПРЕДУПРЕЖДЕНИЕ: mips_24kc отсутствует, вшиваю запрошенный $FEED_URL (little-endian — пакеты на устройстве не установятся)"
          else
            echo "ОШИБКА: ни $FEED_A, ни $FEED_B не отвечают"
            exit 1
          fi

          mkdir -p files/etc/apk/repositories.d
          cat > files/etc/apk/repositories.d/customfeeds.conf <<EOF
          $FEED_URL
          EOF
          echo "=== files/etc/apk/repositories.d/customfeeds.conf ==="
          cat files/etc/apk/repositories.d/customfeeds.conf

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-overwrites
          path: patch-overwrites/
          if-no-files-found: ignore

      - name: Configure
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_ath79=y
          CONFIG_TARGET_ath79_nand=y
          CONFIG_TARGET_ath79_nand_DEVICE_perenio_peacg01=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-app-ser2net=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_LUCI_LANG_ru=y

          CONFIG_PACKAGE_ser2net=y
          CONFIG_PACKAGE_mosquitto-ssl=y
          CONFIG_PACKAGE_wpad-wolfssl=y
          CONFIG_PACKAGE_ath10k-firmware-qca9887-ct=y

          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_mc=y
          CONFIG_PACKAGE_nano-full=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_PACKAGE_python3-pyserial=y
          CONFIG_PACKAGE_python3-xmodem=y
          CONFIG_PACKAGE_kmod-usb-serial-ch341=y
          CONFIG_PACKAGE_kmod-usb-serial-pl2303=y
          EOF

      - name: Verify config
        run: |
          cd openwrt
          echo "=== VERIFY-CONFIG v9 ==="
          grep -q "CONFIG_TARGET_ath79_nand_DEVICE_perenio_peacg01=y" .config \
            || { echo "ОШИБКА: профиль perenio_peacg01 не включён в .config"; exit 1; }
          grep -q "CONFIG_PACKAGE_ser2net=y" .config \
            || { echo "ОШИБКА: ser2net не включён в .config"; exit 1; }
          [ -s files/etc/apk/keys/homed-dev.pub ] \
            || { echo "ОШИБКА: ключ HOMEd пуст или отсутствует"; exit 1; }
          grep -q "apk.homed.dev" files/etc/apk/repositories.d/customfeeds.conf \
            || { echo "ОШИБКА: репозиторий HOMEd не найден в customfeeds.conf"; exit 1; }
          echo "=== Конфигурация и files/ в порядке ==="

      - name: Build
        run: |
          cd openwrt
          make defconfig
          make -j$(nproc) || make -j1 V=s

      - name: List build results
        if: always()
        run: |
          cd openwrt
          echo "=== Результаты сборки: ==="
          find bin/targets -type f 2>/dev/null | sort || echo "bin/targets пуст — сборка не завершилась"

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-peacg01-25.12.6
          path: |
            openwrt/bin/targets/ath79/nand/*sysupgrade.tar
            openwrt/bin/targets/ath79/nand/*initramfs-kernel.bin
            openwrt/bin/targets/ath79/nand/*.manifest
            openwrt/bin/targets/ath79/nand/sha256sums
          if-no-files-found: error
